version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: budgetbridge-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-budgetbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-budgetbridge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budgetbridge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - budgetbridge-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budgetbridge-backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-budgetbridge};Username=${POSTGRES_USER:-budgetbridge};Password=${POSTGRES_PASSWORD:-changeme}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - budgetbridge-network
    restart: unless-stopped
    profiles:
      - full
      - backend-only

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: budgetbridge-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    networks:
      - budgetbridge-network
    restart: unless-stopped
    profiles:
      - full

networks:
  budgetbridge-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
